  <style>

    .reduced-motion .ending-bubble { animation:none; }

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
    const scenes = [
      { title:'통이의 인사', caption:'안녕하세요! 중요한 대화, 함께 준비해요.', translations:{ zh:'你好！重要的对话，我们一起准备。', vi:'Xin chào! Cùng chuẩn bị cho những cuộc trò chuyện quan trọng.', th:'สวัสดี! มาเตรียมบทสนทนาสำคัญไปด้วยกันนะ', en:"Hello! Let's get ready for important conversations together." }, theme:'#dff5fb', accent:'#89d7ee', action:'wave', set:'hello' },

      { title:'집 계약의 걱정', caption:'보증금과 관리비, 차근차근 확인해요.', translations:{ zh:'押金和管理费，一步一步确认。', vi:'Tiền đặt cọc và phí quản lý, kiểm tra từng bước một.', th:'เงินมัดจำและค่าส่วนกลาง ตรวจสอบทีละขั้น', en:'Deposit and maintenance fees, checked step by step.' }, theme:'#fff0df', accent:'#ffbe8f', action:'point', set:'home' },
      { title:'시장 대화', caption:'"이거 얼마예요?" 자신 있게 물어봐요.', translations:{ zh:'"这个多少钱？"大胆地问吧。', vi:'"Cái này bao nhiêu tiền?" Cứ tự tin hỏi nhé.', th:'"อันนี้เท่าไหร่?" ถามได้อย่างมั่นใจ', en:'"How much is this?" Ask with confidence.' }, theme:'#e6f8ee', accent:'#9ce1c0', action:'talk', set:'market' },
      { title:'차 구매 상담', caption:'복잡한 상담도 필요한 말을 바로 꺼내요.', translations:{ zh:'再复杂的咨询，也能马上说出需要的话。', vi:'Dù tư vấn phức tạp, vẫn nói ngay được điều cần nói.', th:'แม้การปรึกษาจะซับซ้อน ก็พูดสิ่งที่ต้องการได้ทันที', en:'Even in a complex consultation, say what you need right away.' }, theme:'#eaf2ff', accent:'#8fb9f5', action:'talk', set:'car' },
      { title:'통이가 함께해요', caption:'걱정 마세요! 통해가 함께할게요.', translations:{ zh:'别担心！통해陪着你。', vi:'Đừng lo! 통해 luôn ở bên bạn.', th:'ไม่ต้องห่วง! 통해 อยู่ข้างคุณ', en:"Don't worry! 통해 is with you." }, theme:'#f9e8f1', accent:'#f19cc1', action:'comfort', set:'hello' },
      { title:'대화 준비 기능', caption:'준비부터 현장 대화 연습까지, 통이와 함께.', translations:{ zh:'从准备到现场对话练习，和통이一起。', vi:'Từ chuẩn bị đến luyện hội thoại tại chỗ, cùng 통이.', th:'ตั้งแต่เตรียมตัวจนถึงฝึกพูดจริง ไปกับ 통이', en:'From preparing to practicing on the spot, with 통이.' }, theme:'#ebf8fb', accent:'#78cddd', action:'point', set:'phone' },

    ];
    const sceneDuration = (sceneIndex) => sceneIndex === scenes.length - 1 ? 7 : 5;
    const DURATION = 5;
    const player = document.getElementById('player');

    function updateLanguageAddress(){

    }
    languageChips.forEach((chip)=>chip.addEventListener('click',()=>{

    }));
    const sceneTitle = document.getElementById('sceneTitle');

    const statusText = document.getElementById('statusText');
    const progressBar = document.getElementById('progressBar');

    function ensureAudio(){

      chords[chordStep++%chords.length].forEach((frequency,i)=>{const osc=audioContext.createOscillator(), gain=audioContext.createGain();osc.type='sine';osc.frequency.value=frequency;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.10/(i+1),start+.22);gain.gain.exponentialRampToValueAtTime(.0001,start+2.9);osc.connect(gain).connect(masterGain);osc.start(start);osc.stop(start+3);});

      const decorations=[...(propGroup.userData.signs??[]), ...(propGroup.userData.clouds??[]).map(({cloud})=>cloud)];
      decorations.forEach((item)=>item.visible=false);
      const box=new THREE.Box3().setFromObject(actors);
      box.union(new THREE.Box3().setFromObject(propGroup));
      decorations.forEach((item)=>item.visible=true);
      const center=box.getCenter(new THREE.Vector3());
      const size=box.getSize(new THREE.Vector3());
      const verticalFov=THREE.MathUtils.degToRad(camera.fov);
      const horizontalFov=2*Math.atan(Math.tan(verticalFov/2)*camera.aspect);
      // 실제 모든 자식 메시 기준: 좌우 3% 여백, 세로는 85% 안에 들어오도록 더 먼 값을 씁니다.
      const distanceForWidth=(size.x/.94)/(2*Math.tan(horizontalFov/2));
      const distanceForHeight=(size.y/.85)/(2*Math.tan(verticalFov/2));
      const distance=Math.max(distanceForWidth,distanceForHeight)+box.max.z+.48;
      const viewHeight=2*Math.tan(verticalFov/2)*distance;
      // 발 아래에 6% 이상의 여백을 남기고 3D 영역 안에 안정적으로 세웁니다.
      const footNdc=-.78;

      return { x:center.x, z:distance, y:targetY };
